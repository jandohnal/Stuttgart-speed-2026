    category: usable_now
    priority: high
    path: GameData/Simulation/CarData/*.sim
    count: 86
    format: sim
    doc: docs/formats/sim.md
    tool: tools/sim_dump.py
    output: decomposed/GameData/Simulation/cars.json
    status: partial_decoded
    use: "Referenční hodnoty pro jízdní model fiktivních aut podle éry"

