    count: 73
    format: ini
    status: decoded
    doc: docs/formats/crp.md
    tool: tools/crp2gltf.py
    notes: "Seznam textur, pozice kamery řidiče; styly [styleN] (díl a typ pro každý slot = varianta modelu) a podmínky alternativních textur [fileN.<položka>] (D-022); .clr jsou barvy pruhů (stripepackage), ne lak"

  - id: car_database
    category: usable_now
    priority: medium
    path: FEData/Data/nfs5.car
    count: 1
    format: car
    status: partial
    doc: docs/formats/car.md
    tool: tools/car_colors.py
    notes: "Databáze aut menu, 109 záznamů po 0x670 B: jméno, model, klíč varianty, styl modelu (0x1C0 + 1), palety barev laku (19, první = tovární) a interiéru (5). Ostatní pole nerozluštěná."
    use: "Volba barvy laku v menu, varianta modelu (styl)"

  - id: track_text_config
    category: usable_now
    priority: medium
    path: ["GameData/Track/*.map", "GameData/Track/*.scn", "GameData/Track/animdefs.txt"]
    count: 94
    format: ini/text
    status: readable
    doc: docs/formats/scn.md
    notes: "Tónování, zvukové prvky, kamery, startovní pozice, vlastnosti objektů (hmotnost, průjezdnost). .scn: GEOM_ELEMENT (značka objektu jako 4CC), TRIGGER_ELEMENT (start/cíl); animdefs.txt: collideType, mass podle značky"
    use: "Předloha atmosféry a interakce s objekty"

