# Inventura dat originální hry NFS5 (Porsche 2000), verze 3.5 (mod, nGlide, oficiální přídavná auta).
# Cesty jsou relativní ke složce sources/ (kopie instalace hry). Rozbalené výstupy jdou do decomposed/ se stejnou strukturou.
# Obě složky jsou v .gitignore, data existují jen lokálně.
# category: usable_now | unpack | to_write
# priority: high | medium | low | none (podle docs/decisions.md)
schema_version: 1
updated: 2026-10-19
install_size_mb: 540
tracks: [alps, autobahn, canyon, castle, coastal, farmland, foothills, forest, industrial, monaco1, monaco2, monaco3, monaco4, monaco5, skidpad]

items:
  - id: car_physics
    category: usable_now
    priority: high
    path: GameData/Simulation/CarData/*.sim
    count: 86
    format: sim
    doc: docs/formats/sim.md
    tool: tools/sim_dump.py
    output: decomposed/GameData/Simulation/cars.json
    status: mostly_decoded  # meanings verified from Porsche.exe (Ghidra), 2026-10-19
    use: "Referenční hodnoty pro jízdní model fiktivních aut podle éry"

  - id: ai_config
    category: usable_now
    priority: high
    path: GameData/Simulation/AI/*.csv
    count: 6
    format: csv
    doc: docs/formats/ai-csv.md
    tool: tools/ai_csv2json.py
    output: decomposed/GameData/Simulation/AI/*.json
    status: decoded
    notes: "Osobnosti soupeřů, gumička podle vzdálenosti, rozestupy v koloně, komentáře designérů. Každé CSV má binární dvojče .bin (int32, 16.16), převod je proti němu ověřený; prsonal.bin je z jiné revize CSV. TRAFCFG.DAT/.DES zatím nepřevedeno"
    use: "Logika a výchozí čísla AI"

  - id: ai_car_profiles
    category: usable_now
    priority: medium
    path: ["GameData/Simulation/AICarData/*.ais", "GameData/Simulation/AI/TRAFCFG.DAT"]
    count: 23
    format: ais
    doc: docs/formats/ais.md
    tool: tools/ais2json.py
    output: ["decomposed/GameData/Simulation/AICarData/ais.json", "decomposed/GameData/Simulation/AI/trafcfg.json"]
    status: partial_decoded
    notes: "304 B: jméno rodiny + tabulka A (24 float, 8 → 30, hypotéza dohled v m podle rychlosti) + tabulka B (40 float, klesá, hypotéza max. rychlost podle ostrosti zatáčky). TRAFCFG: dohled 12–30 m a regulátory boční polohy a natočení AI ve dvou sadách (in control / out of control) – originál neřídil AI plnou simulací"
    use: "Srovnání a výchozí hodnoty pro AI soupeřů (docs/opponents.md)"

  - id: car_text_config
    category: usable_now
    priority: low
    path: ["GameData/CarModel/*.tpg", "GameData/CarModel/*.clr"]
    count: 73
    format: ini
    status: decoded
    doc: docs/formats/crp.md
    tool: tools/crp2gltf.py
    notes: "Seznam textur, pozice kamery řidiče; styly [styleN] (díl a typ pro každý slot = varianta modelu) a podmínky alternativních textur [fileN.<položka>] (D-022); .clr jsou barvy pruhů (stripepackage), ne lak"

  - id: car_database
    category: usable_now
    priority: medium
    path: FEData/Data/nfs5.car
    count: 1
    format: car
    status: partial
    doc: docs/formats/car.md
    tool: tools/car_colors.py
    notes: "Databáze aut menu, 109 záznamů po 0x670 B: jméno, model, klíč varianty, rodina (.ais), styl modelu (0x1C0 + 1), seznam nabízených dílů (0x32E) a dílů z továrny (0x3B6), palety barev laku (19, první = tovární) a interiéru (5). Ostatní pole nerozluštěná."
    use: "Volba barvy laku v menu, varianta modelu (styl), díly Stock / Sport (tools/parts.py)"

  - id: parts_catalogue
    category: usable_now
    priority: medium
    path: FEData/Data/nfs5.prt
    count: 1
    format: prt
    status: decoded
    doc: docs/formats/prt.md
    tool: tools/parts.py
    notes: "Katalog dílů obchodu, 744 záznamů po 0x168 B: ID, název (festrings.csv), řada, kategorie, skupina, rok, hmotnost, vmax, účinek c0/c4, typ pneumatik, převodovka, křivka momentu. Vzorce použití z Porsche.exe 0x49CB50 (konstanty čte nástroj z exe)."
    use: "Přepínač Stock / Sport a volba pneumatik v menu (D-024)"

  - id: track_text_config
    category: usable_now
    priority: medium
    path: ["GameData/Track/*.map", "GameData/Track/*.scn", "GameData/Track/animdefs.txt"]
    count: 94
    format: ini/text
    status: readable
    doc: docs/formats/scn.md
    notes: "Tónování, zvukové prvky, kamery, startovní pozice, vlastnosti objektů (hmotnost, průjezdnost). .scn: GEOM_ELEMENT (značka objektu jako 4CC, vrcholy předlohy se umístí bez jejího tr; FNSH = dlaždice cílové čáry), TRIGGER_ELEMENT (start/cíl); animdefs.txt: collideType, mass podle značky"
    use: "Předloha atmosféry a interakce s objekty"

  - id: crp_container
    category: unpack
    priority: medium
    path: ["GameData/CarModel/*.crp", "GameData/Track/*.crp", "FEData/Models/*.crp"]
    count: {cars: 44, tracks: 15, menu: 8}
    format: crp
    doc: docs/formats/crp.md
    tool: tools/archives.py
    status: decoded_cars

  - id: car_geometry
    category: to_write
    priority: medium
    path: GameData/CarModel/*.crp
    count: 44
    doc: docs/formats/crp.md
    tool: tools/crp2gltf.py
    output: "decomposed/GameData/CarModel/<auto>/<auto>.gltf"
    status: decoded
    checked: "všech 44 OK (tools/mesh_check.py, docs/model-check.md)"
    reference: "CrpLib z LibOpenNFS"
    use: "glTF pro soukromou vizuální referenci"

  - id: track_geometry
    category: to_write
    priority: low
    path: GameData/Track/*.crp
    count: 15
    doc: docs/formats/crp.md
    tool: tools/track2gltf.py
    output: "decomposed/GameData/Track/<trať>/<trať>.gltf + <trať>_road.json + <trať>_objects.json + <trať>_lights.json"
    status: partial
    checked: "všech 15 převedeno, normály v pořádku, na hlavní trase bez děr; varování: spáry u okraje silnice, vedlejší úseky SimD mimo geometrii (docs/model-check.md)"
    notes: "Převedeno všech 15 tratí. SimD = řezy silnice (pozice, vektory, šířky) v úsecích, start/cíl z *_fstart.scn, rozmístěné objekty z matice tr se značkou v Base 0x44 (*_objects.json), světelné záře a zdroje částic z podpoložek ef (*_lights.json, 0–700 září na trať)"
    use: "Jen náhled pro inspiraci stylem (D-005)"

  - id: flares
    category: usable_now
    priority: low
    path: GameData/Render/flare.dat
    count: 1
    format: flare
    doc: docs/formats/flare.md
    tool: tools/flare.py
    output: decomposed/GameData/Render/flares.json
    status: partial_decoded
    notes: "39 září po 140 B: dvě vrstvy (textura z common.fsh, ARGB barva, velikost), blikání fáze/svítí/nesvítí. Jednotky velikosti a tiků odhadnuté. flarepos.dat (odlesky slunce) nerozluštěné, particle.ini viz particles"
    use: "Noční světla tratí v prototypu (D-021), předloha pro vlastní tratě"

  - id: particles
    category: usable_now
    priority: low
    path: GameData/Render/particle.ini
    count: 1
    format: particle
    doc: docs/formats/particle.md
    tool: tools/particles.py
    output: decomposed/GameData/Render/particles.json
    status: partial_decoded
    notes: "62 částicových systémů v textovém INI (kouř, pára, vodopády, fontány, jiskry, výbuch bedny). tag = ID čtyři znaky little-endian (klíč zdrojů ef druhu 3 v tratích), matid = textura v particle.fsh big-endian. Jednotky rychlosti, životnosti a váhy odhadnuté. particle.dat (binární, nejspíš totéž) nerozluštěný"
    use: "Jiskry auta (D-028), předloha pro zdroje částic tratí"

  - id: track_binary_data
    category: to_write
    priority: low
    path: ["GameData/Track/*.edg", "*.jnc", "Data/*.rho", "Cops/*.cop"]
    status: unknown
    notes: "Podle názvů: okraje (.edg), rozcestí (.jnc), policie (.cop); Data/TR*.RHO (2048 B) zřejmě z NFS4"

  - id: track_ai_lines
    category: usable_now
    priority: high
    path: ["GameData/Track/racer/work/*.lsp", "GameData/Track/*_forward.key", "GameData/Track/*_backwards.key"]
    count: 58
    format: lsp
    doc: docs/formats/lsp.md
    tool: tools/ai_lines.py
    output: decomposed/GameData/Track/<trať>/<trať>_ai.json
    status: partial_decoded
    notes: "Ideální stopy soupeřů: dvě na trať, bod (−x, z) pro každý řez SimD (ověřeno na 15 tratích), uložené jako boční odchylka od středu řezu. .key: páry (řez, hodnota 149–600) se zarážkou (100000, 600), význam zatím neznámý (tempo po úsecích?)"
    use: "Stopa pro AI soupeřů v prototypu (D-026)"

  - id: textures
    category: unpack
    priority: medium
    path: ["GameData/CarModel/*.fsh", "FEData/**/*.fsh", "GameData/DashHud/*.fsh", "GameData/Track/*.fsh", "GameData/Track/Sky/*.fsh", "GameData/Render/*.fsh"]
    count: 553
    format: fsh
    doc: docs/formats/fsh.md
    tool: tools/fsh2png.py
    output: "decomposed/<cesta bez přípony>/*.png + index.json"
    status: decoded
    notes: "SHPI, 10 425 obrázků. 8bitové (0x7B) s paletou 0x2A/0x29, 16/24/32bitové. 15 souborů celých v RefPack, 222 obrázků s pixely v RefPack"

  - id: sounds
    category: unpack
